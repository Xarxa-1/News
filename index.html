<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandos Oficials de l'Espluga de Francolí</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f5f7fa; color: #333; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
        .bando-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 5px solid #3498db; }
        .bando-title { font-size: 20px; font-weight: bold; color: #2c3e50; margin: 0 0 10px 0; }
        .bando-date { font-size: 13px; color: #7f8c8d; margin-bottom: 15px; font-style: italic; }
        .bando-content { font-size: 15px; line-height: 1.6; color: #555; }
        .bando-link { display: inline-block; margin-top: 15px; color: #3498db; text-decoration: none; font-weight: bold; }
        .bando-link:hover { text-decoration: underline; }
        .no-data { text-align: center; color: #7f8c8d; font-style: italic; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>📢 Bandos de l'Espluga de Francolí</h1>
    <div id="contenidor-bandos">
        <p class="no-data">Carregant les darreres notificacions de l'agent diari...</p>
    </div>

    <script>
        async function carregarBandos() {
            const contenidor = document.getElementById('contenidor-bandos');
            try {
                // Llegim el fitxer JSON que actualitza diàriament el nostre agent de Python
                const resposta = await fetch('noticies.json');
                if (!resposta.ok) throw new Error("No s'ha trobat el fitxer de dades.");
                
                const bandos = await resposta.json();
                
                if (bandos.length === 0) {
                    contenidor.innerHTML = '<p class="no-data">No hi ha cap bando registrat actualment.</p>';
                    return;
                }

                contenidor.innerHTML = ''; // Netejar missatge de càrrega
                
                // Els mostrem ordenats del més nou al més antic
                bandos.reverse().forEach(bando => {
                    const card = document.createElement('div');
                    card.className = 'bando-card';
                    card.innerHTML = `
                        <h2 class="bando-title">${bando.title}</h2>
                        <div class="bando-date">Publicat el: ${bando.pubDate}</div>
                        <div class="bando-content">${bando.content}</div>
                        <a href="${bando.link}" target="_blank" class="bando-link">Veure a l'eBando original →</a>
                    `;
                    contenidor.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                contenidor.innerHTML = '<p class="no-data" style="color:red;">Error de l\'agent: Encara s\'ha d\'executar el programa de Python per primera vegada per generar les dades.</p>';
            }
        }

        // Executar la funció en obrir la pàgina
        carregarBandos();
    </script>

</body>
</html>
