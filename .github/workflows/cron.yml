name: Agent d'Actualitat Municipal

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar repositori
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Canviat a 0 per més context
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Instal·lar dependències
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser
    
    - name: Verificar agent.py
      run: |
        if [ -f "agent.py" ]; then
          echo "✅ agent.py existeix"
          echo "Contingut:"
          cat agent.py | head -30
        else
          echo "❌ agent.py no trobat!"
          echo "Fitxers al directori:"
          ls -la
          exit 1
        fi
    
    - name: Executar agent
      run: python agent.py
      env:
        PYTHONUNBUFFERED: 1
    
    - name: Verificar noticies.json
      run: |
        if [ -f "noticies.json" ]; then
          echo "✅ noticies.json generat"
          echo "Contingut:"
          cat noticies.json | head -50
          echo "📊 Nombre de notícies: $(python -c 'import json; print(len(json.load(open(\"noticies.json\"))))')"
        else
          echo "❌ No s'ha generat noticies.json"
          echo "Fitxers al directori:"
          ls -la
          exit 1
        fi
    
    - name: Configurar Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Commitar i pujar canvis
      run: |
        git add noticies.json
        if git diff --staged --quiet; then
          echo "ℹ️ No hi ha canvis en noticies.json"
          # Forçar actualització amb timestamp
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "{\"last_update\": \"${TIMESTAMP}\"}" > noticies_timestamp.json
          git add noticies_timestamp.json
          git commit -m "🔄 Forçar actualització: ${TIMESTAMP}" || echo "No cal commitar"
          git push origin HEAD:main || echo "No es pot pujar"
        else
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          git commit -m "🤖 Actualitzar notícies: ${TIMESTAMP}"
          git push origin HEAD:main
        fi
    
    - name: Pujar artefacte de Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: .

  deploy:
    runs-on: ubuntu-latest
    needs: update-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Desplegar a GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
