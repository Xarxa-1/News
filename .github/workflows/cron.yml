name: Agent d'Actualitat Municipal

on:
  # Execució programada: cada dia a les 09:00 UTC
  schedule:
    - cron: '0 9 * * *'
  
  # Permet executar manualment des de la interfície de GitHub
  workflow_dispatch:

# Permisos necessaris per a Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Evitar execucions concurrents per mantenir l'històric net
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Actualitzar dades
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Clonar el repositori
    - name: Clonar repositori
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    # 2. Configurar Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # 3. Instal·lar dependències
    - name: Instal·lar dependències
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser
    
    # 4. Executar l'agent Python
    - name: Executar agent
      run: python agent.py
      env:
        PYTHONUNBUFFERED: 1
    
    # 5. Verificar que s'ha generat el fitxer
    - name: Verificar noticies.json
      run: |
        if [ -f "noticies.json" ]; then
          echo "✅ noticies.json generat correctament"
          cat noticies.json | python -m json.tool > /dev/null && echo "✅ JSON vàlid" || echo "⚠️ JSON invàlid"
          echo "📊 Nombre de notícies: $(python -c 'import json; print(len(json.load(open(\"noticies.json\"))))')"
        else
          echo "❌ No s'ha generat noticies.json"
          exit 1
        fi
    
    # 6. Configurar Git
    - name: Configurar Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    # 7. Commitar i pujar canvis
    - name: Commitar i pujar canvis
      run: |
        # Afegir el fitxer JSON
        git add noticies.json
        
        # Verificar si hi ha canvis
        if git diff --staged --quiet; then
          echo "✅ No hi ha canvis per commitar"
        else
          # Crear commit amb timestamp
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          git commit -m "🤖 Actualitzar notícies: ${TIMESTAMP}"
          git push origin HEAD:main
          echo "✅ Canvis pujats al repositori"
        fi
    
    # 8. Pujar l'artefacte per a Pages
    - name: Pujar artefacte de Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: .

  # Job 2: Desplegar a GitHub Pages (SEPARAT)
  deploy:
    runs-on: ubuntu-latest
    needs: update-data  # Espera que el primer job acabi
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    # 1. Desplegar a GitHub Pages
    - name: Desplegar a GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
