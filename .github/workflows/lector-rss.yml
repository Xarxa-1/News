name: Actualitzar eBando Diari

on:
  schedule:
    - cron: '0 * * * *' # S'executa cada hora
  workflow_dispatch: # Botó manual

jobs:
  actualitzar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permís d'escriptura obligatori
    steps:
      - name: Descarregar codi del repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Forcem una versió moderna i estable

      - name: Instal·lar llibreria de lectura RSS
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Executar bot lector
        run: python lector.py

      - name: Desar els canvis a GitHub automàticament
        run: |
          git config --global user.name "eBando Bot"
          git config --global user.email "actions@github.com"
          git add noticies.json
          git commit -m "Bandos actualitzats automàticament" || exit 0
          git push
